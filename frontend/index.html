<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>wignerf — Wigner Function Simulator</title>
    <!-- Theme before first paint. main.ts is a deferred module, so applying
         the stored preference from lib/theme.ts alone would flash the light
         default at every dark-mode reload. Light needs no class. -->
    <script>
      try {
        if (localStorage.getItem('wignerf.theme') === 'dark')
          document.documentElement.classList.add('dark')
      } catch (e) { /* private mode: fall back to the light default */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
